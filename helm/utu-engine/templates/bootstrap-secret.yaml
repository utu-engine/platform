{{- if and .Release.IsUpgrade (not .Values.secrets.existingSecret) -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace (include "utu-engine.bootstrapSecretName" .) -}}
{{- if not $previous -}}
{{- fail "UTU Engine upgrade blocked: current bootstrap Secret is missing. This chart is NOT an in-place rename of a legacy release; keep the existing PostgreSQL PVC and Secret and plan an explicit migration." -}}
{{- end -}}
{{- range $requiredKey := (list .Values.secrets.keys.databaseUrl .Values.secrets.keys.masterKey .Values.secrets.keys.authKey .Values.secrets.keys.postgresqlAdminPassword .Values.secrets.keys.postgresqlPassword) -}}
{{- if not (index $previous.data $requiredKey) -}}
{{- fail (printf "UTU Engine upgrade blocked: bootstrap Secret is missing required key %q; refusing silent key rotation." $requiredKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.postgresql.enabled) (not .Values.secrets.existingSecret) -}}
{{- fail "postgresql.enabled=false requires secrets.existingSecret with an external PostgreSQL database-url" -}}
{{- end -}}
{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "utu-engine.bootstrapSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $adminPassword := randAlphaNum 32 -}}
{{- $postgresqlPassword := randAlphaNum 32 -}}
{{- $masterKey := randBytes 32 | replace "+" "-" | replace "/" "_" -}}
{{- $authKey := randBytes 32 | replace "+" "-" | replace "/" "_" -}}
{{- $bootstrapAdminPassword := randAlphaNum 24 -}}
{{- if $existing }}
  {{- if index $existing.data .Values.secrets.keys.postgresqlAdminPassword }}
    {{- $adminPassword = index $existing.data .Values.secrets.keys.postgresqlAdminPassword | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.postgresqlPassword }}
    {{- $postgresqlPassword = index $existing.data .Values.secrets.keys.postgresqlPassword | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.masterKey }}
    {{- $masterKey = index $existing.data .Values.secrets.keys.masterKey | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.authKey }}
    {{- $authKey = index $existing.data .Values.secrets.keys.authKey | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.bootstrapAdminPassword }}
    {{- $bootstrapAdminPassword = index $existing.data .Values.secrets.keys.bootstrapAdminPassword | b64dec -}}
  {{- end }}
{{- end }}
{{- $postgresqlHost := printf "%s-postgresql" (include "utu-engine.fullname" .) -}}
{{- $databaseUrl := printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgresql.user $postgresqlPassword $postgresqlHost .Values.postgresql.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "utu-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    utu-engine.io/credentials: session-keys-generated-initial-password-temporary
    utu-engine.io/credential-policy: preserve-on-upgrade
type: Opaque
stringData:
  {{ .Values.secrets.keys.postgresqlAdminPassword }}: {{ $adminPassword | quote }}
  {{ .Values.secrets.keys.postgresqlPassword }}: {{ $postgresqlPassword | quote }}
  {{ .Values.secrets.keys.masterKey }}: {{ $masterKey | quote }}
  {{ .Values.secrets.keys.authKey }}: {{ $authKey | quote }}
  {{ .Values.secrets.keys.bootstrapAdminPassword }}: {{ $bootstrapAdminPassword | quote }}
  {{ .Values.secrets.keys.databaseUrl }}: {{ $databaseUrl | quote }}
{{- end }}
