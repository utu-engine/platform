name: Publish production release

# Ordinary development merges never run this workflow. The first release can
# be started by an explicit push to the one-time release/v1.0.0 branch.
# Future versions use only workflow_dispatch from GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer release (e.g. 1.0.1)
        required: true
        type: string
  push:
    branches: [release/v1.0.0]

permissions:
  contents: write
  packages: write

concurrency:
  group: utu-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'utu-engine/platform'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '1.0.0' }}
      TARGET: ghcr.io/utu-engine/platform
      SOURCE_REPO: ghcr.io/eerkalin/incident-investigation-platform
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate requested release and public chart
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$(sed -n 's/^version: //p' helm/utu-engine/Chart.yaml)" = "$VERSION"
          test "$(sed -n 's/^appVersion: //p' helm/utu-engine/Chart.yaml | tr -d '"')" = "$VERSION"
          grep -q "repository: ghcr.io/utu-engine/platform" helm/utu-engine/values.yaml
          grep -q "tag: \"$VERSION\"" helm/utu-engine/values.yaml
          grep -q "pullPolicy: IfNotPresent" helm/utu-engine/values.yaml
          if grep -REq 'UTU_FULL_TECHNICAL_AUDIT|TOOL_TESTING_LAB_ENABLED|fullTechnicalAudit' helm/utu-engine/; then
            echo "::error::Internal capability leaked into public chart"
            exit 1
          fi
          helm lint helm/utu-engine
          helm template utu-engine helm/utu-engine -n utu-engine > "$RUNNER_TEMP/utu-chart.yaml"
          grep -q "ghcr.io/utu-engine/platform:$VERSION" "$RUNNER_TEMP/utu-chart.yaml"
          if helm template utu-engine helm/utu-engine --set testingLab.enabled=true > /dev/null 2>&1; then
            echo "::error::Tool Lab enabled by an unsupported chart override"; exit 1
          fi
          if helm template utu-engine helm/utu-engine --set internal.fullTechnicalAudit=true > /dev/null 2>&1; then
            echo "::error::Full audit enabled by an unsupported chart override"; exit 1
          fi
      - name: Resolve an independently built candidate
        shell: bash
        run: |
          set -euo pipefail
          source_image="$SOURCE_REPO:release-$VERSION"
          # Candidate image must be anonymously readable; public workflow
          # must not receive source repo read tokens or credentials.
          docker manifest inspect "$source_image" >/dev/null
          source_digest="$(docker buildx imagetools inspect "$source_image" | awk '$1=="Digest:" {print $2;exit}')"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_IMAGE=$SOURCE_REPO@$source_digest" >> "$GITHUB_ENV"
          echo "SOURCE_DIGEST=$source_digest" >> "$GITHUB_ENV"
      - name: Validate real image under attempted env override
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          docker run --rm --platform linux/amd64 \
            -e DATABASE_URL='postgresql+psycopg://release:release@127.0.0.1:5432/release' \
            -e TOOL_TESTING_LAB_ENABLED=true \
            -e UTU_FULL_TECHNICAL_AUDIT=true \
            --entrypoint python "$SOURCE_IMAGE" -c '
          from app.version import APP_VERSION
          from app.main import app
          from app.release_profile import is_production_image
          from app.rca.audit_visibility import full_technical_audit_enabled, resolve_technical_audit_mode
          assert APP_VERSION == "1.0.0"
          assert is_production_image()
          assert full_technical_audit_enabled() is False
          assert resolve_technical_audit_mode("audit", is_superuser=True) == "audit"
          assert not any(route.path.startswith("/api/v1/tool-testing-lab") for route in app.routes)
          print("HARDENED PRODUCTION IMAGE PASS")
          '
      - name: Package exact Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package helm/utu-engine --destination dist
          test -s "dist/utu-engine-$VERSION.tgz"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified immutable image to versioned GHCR package
        run: |
          set -euo pipefail
          # Refuse to overwrite existing stable versions.
          if docker buildx imagetools inspect "$TARGET:$VERSION" >/dev/null 2>&1; then
            echo "::error::Stable image tag already exists. No overwrite permitted."
            exit 1
          fi
          docker buildx imagetools create --tag "$TARGET:$VERSION" "$SOURCE_IMAGE"
          docker buildx imagetools inspect "$TARGET:$VERSION"
      - name: Publish Helm OCI chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/utu-engine-$VERSION.tgz" oci://ghcr.io/utu-engine/charts
      - name: Update stable latest alias
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$TARGET:latest" "$TARGET:$VERSION"
          docker buildx imagetools inspect "$TARGET:latest"
      - name: Check unauthenticated download availability
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          helm registry logout ghcr.io || true
          DOCKER_CONFIG="$(mktemp -d)"
          HELM_REGISTRY_CONFIG="$(mktemp)"
          export DOCKER_CONFIG HELM_REGISTRY_CONFIG
          docker manifest inspect "$TARGET:$VERSION" >/dev/null || {
            echo "::error::Docker package is not public. Set GHCR package visibility to Public, then retry release validation."
            exit 1
          }
          helm pull oci://ghcr.io/utu-engine/charts/utu-engine --version "$VERSION" --destination "$RUNNER_TEMP" || {
            echo "::error::Helm OCI package is not public. Set GHCR chart package visibility to Public."
            exit 1
          }
      - name: Create public GitHub Release with Helm archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "dist/utu-engine-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UTU Engine v$VERSION" --notes-file RELEASE_NOTES.md
      - name: Record provenance
        run: |
          {
            echo "### UTU Engine v$VERSION published"
            echo "Source candidate digest: $SOURCE_DIGEST"
            echo "Stable image: $TARGET:$VERSION"
            echo "Alias: $TARGET:latest"
            echo "Helm: oci://ghcr.io/utu-engine/charts/utu-engine"
          } >> "$GITHUB_STEP_SUMMARY"
